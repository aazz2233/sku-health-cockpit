[project]
name = "sku-health-cockpit"
version = "0.1.0"
description = "Multi-store SKU profit, inventory health and anomaly diagnosis cockpit for cross-border e-commerce"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }

dependencies = [
    # data
    "pandas>=2.2",
    "numpy>=1.26",
    "pyarrow>=15.0",
    "duckdb>=1.0",
    "sqlalchemy>=2.0",
    "pymysql>=1.1",
    "cryptography>=43",
    # contracts & validation
    "pydantic>=2.7",
    "pandera>=0.19",
    # io
    "openpyxl>=3.1",
    "xlsxwriter>=3.2",
    "pyyaml>=6.0",
    "jinja2>=3.1",
    "python-dotenv>=1.0",
    # demo data
    "faker>=25.0",
    # matching (B module)
    "rapidfuzz>=3.9",
    # ai layer
    "litellm>=1.40",
    "tenacity>=8.3",
    "tiktoken>=0.7",
    # app
    "streamlit>=1.36",
    "plotly>=5.22",
]

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "freezegun>=1.5",
    "ruff>=0.5",
    "mypy>=1.10",
    "types-pyyaml",
    "pre-commit>=3.7",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "C4", "RUF"]
# RUF001-003 flag fullwidth punctuation in Chinese text/comments/docstrings.
ignore = ["E501", "RUF001", "RUF002", "RUF003"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
warn_unused_ignores = true
warn_redundant_casts = true
ignore_missing_imports = true
check_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
# NOTE: tmp_path is avoided in this suite: this Windows sandbox denies access to
# directories created with mode 0o700 (what tempfile.mkdtemp uses). Use the
# `workdir` fixture from tests/conftest.py instead.
addopts = "-q --strict-markers"
markers = [
    "slow: long-running integration checks",
    "integration: needs a reachable MySQL instance (skipped otherwise)",
]

[tool.coverage.run]
source = ["src"]
omit = ["*/__main__.py"]
